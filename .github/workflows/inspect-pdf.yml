name: Inspecter le PDF des sermons
on:
  push:
    branches: [inspect-pdf]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q gdown pypdf
      - name: Télécharger
        run: gdown --retries 3 "1waNFF0n2AA6OgYrOAo2AVdu8wff7Rekg" -O sermons.pdf
      - name: Livres et Sept âges
        run: |
          python3 - <<'P'
          from pypdf import PdfReader
          r=PdfReader("sermons.pdf")
          items=[]
          def walk(o,path):
              last=None
              for x in o:
                  if isinstance(x,list): walk(x,path+[last])
                  else:
                      try: items.append((tuple(path),x.title.strip(),r.get_destination_page_number(x)))
                      except Exception: pass
                      last=x.title.strip()
          walk(r.outline,[])
          starts=sorted({p for _,_,p in items})
          for path,t,p in items:
              if path and ("Livres" in path[0] or "Expos" in path[0]):
                  end=next((s for s in starts if s>p),len(r.pages))
                  print(repr(path),"|",t,"| p",p,"->",end, "(",end-p,"pages)")
          P
      - name: Débuts de quelques livres
        run: |
          python3 - <<'P'
          import subprocess
          from pypdf import PdfReader
          r=PdfReader("sermons.pdf")
          items=[]
          def walk(o,path):
              last=None
              for x in o:
                  if isinstance(x,list): walk(x,path+[last])
                  else:
                      try: items.append((tuple(path),x.title.strip(),r.get_destination_page_number(x)))
                      except Exception: pass
                      last=x.title.strip()
          walk(r.outline,[])
          livres=[i for i in items if i[0] and ("Livres" in i[0][0] or "Expos" in i[0][0])]
          for path,t,p in livres[:4]+livres[-3:]+[livres[len(livres)//2]]:
              txt=subprocess.run(["pdftotext","-f",str(p+1),"-l",str(p+2),"-enc","UTF-8","sermons.pdf","-"],capture_output=True,text=True).stdout
              print("\n######",t,p); print(txt[:1500])
          P
